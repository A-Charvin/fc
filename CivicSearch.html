<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frontenac Road and Civic Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #064e3b;
    --primary-hover: #065f46;
    --accent: #10b981;
    --bg-body: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  }

  * {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-body);
    color: var(--text-main);
    min-height: 100vh;
    margin: 0;
    padding: 1.5rem;
    line-height: 1.55;
  }

  .page {
    max-width: 1320px;
    margin: 0 auto;
  }

  .page-header {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    padding: 1.75rem;
    margin-bottom: 1rem;
  }

  h1 {
    font-weight: 700;
    font-size: 1.6rem;
    margin: 0 0 1.25rem 0;
    color: var(--primary);
    letter-spacing: -0.025em;
  }

  .search-wrapper {
    display: block;
  }

  .search-field {
    position: relative;
    width: 100%;
  }

  .search-input {
    width: 100%;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    padding: 0.95rem 1.2rem;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text-main);
    transition: all 0.2s ease;
    outline: none;
    background: white;
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
  }

  .search-btn {
    width: 100%;
    margin-top: 0.75rem;
    background-color: var(--primary);
    border: none;
    color: white;
    padding: 0.95rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .search-btn:hover {
    background-color: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  @media (min-width: 640px) {
    .search-wrapper {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .search-field {
      flex: 1;
    }

    .search-btn {
      width: auto;
      margin-top: 0;
      padding: 0.95rem 1.75rem;
    }
  }

  .autocomplete-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    max-height: 320px;
    overflow-y: auto;
    z-index: 1200;
    display: none;
  }

  .autocomplete-dropdown.active {
    display: block;
  }

  .autocomplete-group {
    padding: 0.7rem 1.25rem 0.35rem;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    background: white;
    position: sticky;
    top: 0;
  }

  .autocomplete-item {
    padding: 0.8rem 1.25rem;
    cursor: pointer;
    border-bottom: 1px solid #f1f5f9;
    transition: background 0.15s ease;
    font-size: 0.95rem;
  }

  .autocomplete-item:last-child {
    border-bottom: none;
  }

  .autocomplete-item:hover,
  .autocomplete-item.active {
    background-color: #f0fdf4;
  }

  .autocomplete-type {
    display: inline-block;
    min-width: 68px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    margin-right: 0.5rem;
    vertical-align: middle;
  }

  .autocomplete-empty {
    padding: 0.9rem 1.25rem;
    color: var(--text-muted);
  }

  mark {
    background: #d1fae5;
    color: inherit;
    padding: 0 2px;
    border-radius: 3px;
  }

  .app-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    align-items: start;
  }

  @media (max-width: 959px) {
    .app-layout {
      display: flex;
      flex-direction: column;
    }

    .map-panel {
      order: -1;
      height: 280px;
      position: sticky;
      top: 0.75rem;
      z-index: 900;
      box-shadow: var(--shadow-lg);
    }
  }

  @media (min-width: 960px) {
    .app-layout {
      grid-template-columns: 430px minmax(0, 1fr);
      height: calc(100vh - 3rem);
      align-items: stretch;
    }

    .left-panel {
      height: 100%;
      overflow: auto;
      padding-right: 2px;
    }

    .map-panel {
      position: sticky;
      top: 0;
      height: 100%;
      min-height: 0;
    }
  }

  .left-panel {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 0;
  }

  .panel-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    box-shadow: var(--shadow-sm);
  }

  .map-panel {
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: white;
  }

  #map {
    height: 100%;
    width: 100%;
    display: block;
  }

  .message {
    font-weight: 500;
    margin: 0;
  }

  .message.muted {
    color: var(--text-muted);
  }

  .message.success {
    color: var(--accent);
    font-weight: 600;
  }

  .message.warning {
    color: #f59e0b;
  }

  .message.error {
    color: #ef4444;
  }

  .result-summary {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
  }

  .summary-title {
    font-weight: 700;
    color: var(--primary);
    font-size: 1.05rem;
  }

  .summary-subtitle {
    color: var(--text-muted);
    font-size: 0.92rem;
    margin-top: 0.2rem;
  }

  .segment-list {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    overflow: auto;
    min-height: 120px;
    padding-bottom: 0.25rem;
  }

  .segment-row {
    display: flex;
    justify-content: space-between;
    gap: 0.8rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.8rem;
    cursor: pointer;
    background: white;
    transition: all 0.15s ease;
  }

  .segment-row:hover {
    border-color: var(--accent);
  }

  .segment-row.active {
    border-color: var(--accent);
    background: #f0fdf4;
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  .segment-row-main {
    min-width: 0;
  }

  .segment-row-title {
    font-weight: 600;
    margin-bottom: 0.35rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .segment-row-ranges {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .range-chip {
    display: inline-block;
    background: #f1f5f9;
    border-radius: 999px;
    padding: 0.18rem 0.55rem;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .segment-row-actions {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-shrink: 0;
  }

  .mini-btn {
    border: 1px solid var(--border);
    background: white;
    border-radius: 8px;
    padding: 0.45rem 0.65rem;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
    color: var(--text-main);
    transition: all 0.15s ease;
  }

  .mini-btn:hover {
    border-color: var(--accent);
    color: var(--primary);
  }

  .mini-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  .detail-panel {
    background: #fcfcfc;
  }

  .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 0.9rem;
  }

  .detail-title {
    font-weight: 700;
    color: var(--primary);
    font-size: 1.05rem;
  }

  .detail-subtitle {
    color: var(--text-muted);
    font-size: 0.88rem;
    margin-top: 0.15rem;
  }

  .detail-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.65rem;
    margin-bottom: 0.9rem;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .detail-meta strong {
    color: var(--text-main);
    font-weight: 600;
  }

  .detail-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.9rem;
  }

  .tab {
    flex: 1;
    padding: 0.65rem 0.75rem;
    border: 1px solid var(--border);
    background: white;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    color: var(--text-main);
    transition: all 0.15s ease;
  }

  .tab:hover {
    border-color: var(--accent);
    color: var(--primary);
  }

  .tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  .detail-address-list {
    max-height: 260px;
    overflow: auto;
    border-top: 1px solid var(--border);
    padding-top: 0.75rem;
  }

  .detail-count {
    color: var(--text-muted);
    font-size: 0.88rem;
    margin-bottom: 0.55rem;
  }

  .address-item {
    padding: 0.5rem 0;
    border-bottom: 1px solid #f1f5f9;
    font-size: 0.9rem;
  }

  .address-item:last-child {
    border-bottom: none;
  }

  .footer {
    text-align: center;
    font-size: 0.875rem;
    color: var(--text-muted);
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    font-weight: 500;
  }

  .custom-civic-marker {
    background-color: var(--primary);
    color: white;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    border: 2px solid white;
    box-shadow: var(--shadow-md);
  }

  .leaflet-popup-content-wrapper {
    border-radius: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Frontenac Road and Civic Finder</h1>

      <div class="search-wrapper">
        <div class="search-field">
          <input
            type="text"
            id="search"
            class="search-input"
            placeholder="Enter road name or full address"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="autocomplete-dropdown" class="autocomplete-dropdown" role="listbox"></div>
        </div>
        <button class="search-btn" type="button" onclick="performSearch()">Search</button>
      </div>
    </header>

    <div class="app-layout">
      <div class="left-panel">
        <div id="status"></div>
        <div id="result-summary" class="panel-card result-summary" hidden></div>
        <div id="detail-panel" class="panel-card detail-panel" hidden></div>
        <div id="segment-list" class="segment-list" hidden></div>
      </div>

      <div class="map-panel">
        <div id="map"></div>
      </div>
    </div>

    <div class="footer">Made with &hearts; in Frontenac</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.0/proj4.js"></script>
  <script>
    const NAD83_18N = "+proj=utm +zone=18 +datum=NAD83 +units=m +no_defs";
    const WGS84 = "+proj=longlat +datum=WGS84 +no_defs";

    let roads = [];
    let civicAddresses = [];
    let map;
    let roadLayerGroup;
    let civicLayerGroup;

    let currentSuggestions = [];
    let activeSuggestionIndex = -1;

    let currentMatchingSegments = [];
    let currentAddress = null;
    let selectedSegment = null;
    let selectedSide = null;
    let segmentLayers = {};

    const searchInput = document.getElementById("search");
    const dropdown = document.getElementById("autocomplete-dropdown");
    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("result-summary");
    const detailEl = document.getElementById("detail-panel");
    const segmentListEl = document.getElementById("segment-list");

    function debounce(func, wait) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    function normalize(value) {
      return String(value || "")
        .toUpperCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightMatch(text, query) {
      const safeText = escapeHtml(text);
      const tokens = query
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .map(function (token) {
          return escapeRegExp(escapeHtml(token));
        });

      if (!tokens.length) {
        return safeText;
      }

      const regex = new RegExp("(" + tokens.join("|") + ")", "gi");
      return safeText.replace(regex, "<mark>$1</mark>");
    }

    function closeDropdown() {
      dropdown.classList.remove("active");
      activeSuggestionIndex = -1;
    }

    function getSuggestions(rawQuery) {
      const query = normalize(rawQuery);

      if (query.length < 2) {
        return [];
      }

      const tokens = query.split(" ").filter(Boolean);
      const items = [];
      const seen = new Set();

      roads.forEach(function (road) {
        const attributes = road?.attributes;
        if (!attributes) return;

        const label = String(attributes.NAME_FULL || "").trim();
        const value = normalize(label);

        if (!value) return;

        const startsWith = value.startsWith(query);
        const includesExact = value.includes(query);
        const includesTokens = tokens.every(function (token) {
          return value.includes(token);
        });

        if (!includesExact && !includesTokens) return;

        const key = "road:" + value;
        if (seen.has(key)) return;

        seen.add(key);

        items.push({
          type: "road",
          label: label,
          value: value,
          score: startsWith ? 0 : includesExact ? 1 : 2
        });
      });

      civicAddresses.forEach(function (address) {
        const attributes = address?.attributes;
        if (!attributes) return;
        if (attributes.StreetNumber == null) return;

        const label = (attributes.StreetNumber + " " + (attributes.StreetName || "")).trim();
        const value = normalize(label);

        if (!value) return;

        const startsWith = value.startsWith(query);
        const includesExact = value.includes(query);
        const includesTokens = tokens.every(function (token) {
          return value.includes(token);
        });

        if (!includesExact && !includesTokens) return;

        const key = "address:" + value;
        if (seen.has(key)) return;

        seen.add(key);

        items.push({
          type: "address",
          label: label,
          value: value,
          score: startsWith ? 10 : includesExact ? 11 : 12
        });
      });

      items.sort(function (a, b) {
        return a.score - b.score || a.label.localeCompare(b.label);
      });

      return items.slice(0, 12);
    }

    function renderDropdown(items, rawQuery) {
      dropdown.innerHTML = "";
      currentSuggestions = items;
      activeSuggestionIndex = -1;

      if (!items.length) {
        dropdown.innerHTML = '<div class="autocomplete-empty">No matches found</div>';
        dropdown.classList.add("active");
        return;
      }

      let lastType = "";

      items.forEach(function (item, index) {
        if (item.type !== lastType) {
          const group = document.createElement("div");
          group.className = "autocomplete-group";
          group.textContent = item.type === "road" ? "Roads" : "Addresses";
          dropdown.appendChild(group);
          lastType = item.type;
        }

        const row = document.createElement("div");
        row.className = "autocomplete-item";
        row.id = "suggestion-" + index;
        row.setAttribute("role", "option");

        row.innerHTML =
          '<span class="autocomplete-type">' + (item.type === "road" ? "Road" : "Address") + "</span>" +
          "<span>" + highlightMatch(item.label, rawQuery) + "</span>";

        row.addEventListener("mousedown", function (event) {
          event.preventDefault();
          selectSuggestion(index);
        });

        dropdown.appendChild(row);
      });

      dropdown.classList.add("active");
    }

    function updateActiveSuggestion(direction) {
      const items = dropdown.querySelectorAll(".autocomplete-item");

      if (!items.length) return;

      activeSuggestionIndex = (activeSuggestionIndex + direction + items.length) % items.length;

      items.forEach(function (item) {
        item.classList.remove("active");
      });

      const activeItem = items[activeSuggestionIndex];
      activeItem.classList.add("active");
      activeItem.scrollIntoView({ block: "nearest" });
    }

    function selectSuggestion(index) {
      const item = currentSuggestions[index];

      if (!item) return;

      searchInput.value = item.label;
      closeDropdown();
      performSearch();
    }

    const debouncedAutoSuggest = debounce(function () {
      const rawQuery = searchInput.value.trim();

      if (rawQuery.length < 2) {
        closeDropdown();
        return;
      }

      const items = getSuggestions(rawQuery);
      renderDropdown(items, rawQuery);
    }, 200);

    searchInput.addEventListener("input", debouncedAutoSuggest);

    searchInput.addEventListener("focus", function () {
      if (searchInput.value.trim().length >= 2) {
        debouncedAutoSuggest();
      }
    });

    searchInput.addEventListener("keydown", function (event) {
      const isOpen = dropdown.classList.contains("active");

      if (!isOpen) {
        if (event.key === "ArrowDown") {
          debouncedAutoSuggest();
        }
        if (event.key === "Enter") {
          performSearch();
        }
        return;
      }

      if (event.key === "ArrowDown") {
        event.preventDefault();
        updateActiveSuggestion(1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        updateActiveSuggestion(-1);
      } else if (event.key === "Enter") {
        event.preventDefault();

        if (activeSuggestionIndex >= 0) {
          selectSuggestion(activeSuggestionIndex);
        } else {
          closeDropdown();
          performSearch();
        }
      } else if (event.key === "Escape") {
        closeDropdown();
      }
    });

    document.addEventListener("click", function (event) {
      if (!event.target.closest(".search-field")) {
        closeDropdown();
      }
    });

    async function fetchAllFeatures(url, max = 1000) {
      let allFeatures = [];
      let offset = 0;
      let done = false;

      while (!done) {
        const requestUrl = url + "&resultOffset=" + offset + "&resultRecordCount=" + max;
        const response = await fetch(requestUrl);

        if (!response.ok) {
          throw new Error("HTTP " + response.status + " while loading " + requestUrl);
        }

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || "ArcGIS error");
        }

        const validFeatures = (data.features || []).filter(function (feature) {
          return feature && feature.attributes;
        });

        allFeatures = allFeatures.concat(validFeatures);

        if (!data.exceededTransferLimit) {
          done = true;
        } else {
          offset += max;
        }
      }

      return allFeatures;
    }

    async function loadData() {
      initMap();

      setStatus("muted", "Loading spatial data...");

      const roadUrl =
        "https://services2.arcgis.com/vJlmDE1PmdTcJF0N/arcgis/rest/services/Frontenac_Road_Nework_View/FeatureServer/0/query?where=1%3D1&outFields=*&f=json";

      const civicUrl =
        "https://services2.arcgis.com/vJlmDE1PmdTcJF0N/arcgis/rest/services/Civic_Address_Points_View_2/FeatureServer/0/query?where=1%3D1&outFields=*&f=json";

      try {
        roads = await fetchAllFeatures(roadUrl);
        civicAddresses = await fetchAllFeatures(civicUrl);

        console.log("Road segments loaded:", roads.length);
        console.log("Civic addresses loaded:", civicAddresses.length);

        let html =
          "Loaded " +
          roads.length +
          " road segments and " +
          civicAddresses.length +
          " civic addresses.";

        setStatus("success", html);

        if (!roads.length) {
          setStatus("warning", "Warning: the road layer returned zero features.");
        }

        if (!civicAddresses.length) {
          setStatus("warning", "Warning: the civic address layer returned zero features.");
        }
      } catch (error) {
        console.error("Error loading data:", error);
        setStatus("error", "Failed to load data. " + escapeHtml(error.message));
      }
    }

    function setStatus(type, html) {
      if (!html) {
        statusEl.innerHTML = "";
        return;
      }

      statusEl.innerHTML = '<p class="message ' + type + '">' + html + "</p>";
    }

    function calculateParity(num) {
      const value = parseInt(num, 10);

      if (!Number.isFinite(value)) {
        return "N/A";
      }

      return value % 2 === 0 ? "Even" : "Odd";
    }

    function inAddressRange(number, fromValue, toValue) {
      const from = parseInt(fromValue, 10);
      const to = parseInt(toValue, 10);

      if (!Number.isFinite(from) || !Number.isFinite(to)) {
        return false;
      }

      return number >= Math.min(from, to) && number <= Math.max(from, to);
    }

    function reprojectCoord(x, y) {
      try {
        return proj4(NAD83_18N, WGS84, [x, y]);
      } catch (error) {
        return [NaN, NaN];
      }
    }

    function formatRange(fromValue, toValue) {
      const from = parseInt(fromValue, 10);
      const to = parseInt(toValue, 10);

      if (!Number.isFinite(from) && !Number.isFinite(to)) {
        return "no range";
      }

      if (!Number.isFinite(from)) {
        return String(to);
      }

      if (!Number.isFinite(to)) {
        return String(from);
      }

      if (from === to) {
        return String(from);
      }

      return from + " to " + to;
    }

    function firstAddressValue(road) {
      const attributes = road?.attributes;

      if (!attributes) {
        return Infinity;
      }

      const left = parseInt(attributes.F_ADDR_L_911, 10);
      if (Number.isFinite(left)) {
        return left;
      }

      const right = parseInt(attributes.F_ADDR_R_911, 10);
      if (Number.isFinite(right)) {
        return right;
      }

      return Infinity;
    }

    function getAddressesForSegmentSide(segmentAttributes, streetName, side) {
      const relevant = [];

      if (!segmentAttributes || !streetName) {
        return relevant;
      }

      const segmentStreetName = normalize(streetName);

      const fromAddr = side === "L" ? segmentAttributes.F_ADDR_L_911 : segmentAttributes.F_ADDR_R_911;
      const toAddr = side === "L" ? segmentAttributes.T_ADDR_L_911 : segmentAttributes.T_ADDR_R_911;
      const startNum = side === "L" ? segmentAttributes.F_ADDR_L_911 : segmentAttributes.F_ADDR_R_911;

      if (fromAddr == null || toAddr == null || startNum == null) {
        return relevant;
      }

      const expectedParity = calculateParity(startNum);

      if (expectedParity === "N/A") {
        return relevant;
      }

      const minAddr = Math.min(parseInt(fromAddr, 10), parseInt(toAddr, 10));
      const maxAddr = Math.max(parseInt(fromAddr, 10), parseInt(toAddr, 10));

      civicAddresses.forEach(function (address) {
        const attributes = address?.attributes;

        if (!attributes) return;

        const civicStreetName = normalize(attributes.StreetName);

        if (civicStreetName !== segmentStreetName) return;

        const civicNumber = parseInt(attributes.StreetNumber, 10);

        if (!Number.isFinite(civicNumber)) return;

        if (civicNumber >= minAddr && civicNumber <= maxAddr && calculateParity(civicNumber) === expectedParity) {
          relevant.push(address);
        }
      });

      relevant.sort(function (a, b) {
        return (parseInt(a.attributes.StreetNumber, 10) || 0) - (parseInt(b.attributes.StreetNumber, 10) || 0);
      });

      return relevant;
    }

    function detectSide(segment, streetNumber) {
      const attributes = segment?.attributes;

      if (!attributes) {
        return "L";
      }

      const parity = calculateParity(streetNumber);

      const inLeft =
        inAddressRange(streetNumber, attributes.F_ADDR_L_911, attributes.T_ADDR_L_911) &&
        parity === calculateParity(attributes.F_ADDR_L_911);

      if (inLeft) {
        return "L";
      }

      const inRight =
        inAddressRange(streetNumber, attributes.F_ADDR_R_911, attributes.T_ADDR_R_911) &&
        parity === calculateParity(attributes.F_ADDR_R_911);

      if (inRight) {
        return "R";
      }

      return "L";
    }

    function clearResultsUI() {
      currentMatchingSegments = [];
      currentAddress = null;
      selectedSegment = null;
      selectedSide = null;
      segmentLayers = {};

      summaryEl.hidden = true;
      detailEl.hidden = true;
      segmentListEl.hidden = true;

      summaryEl.innerHTML = "";
      detailEl.innerHTML = "";
      segmentListEl.innerHTML = "";

      if (civicLayerGroup) {
        civicLayerGroup.clearLayers();
      }
    }

    function performSearch() {
      closeDropdown();

      const rawQuery = searchInput.value.trim();

      clearResultsUI();

      if (!rawQuery) {
        setStatus("error", "Please enter a road name or full address.");
        showSearchLayers(null, []);
        return;
      }

      const query = normalize(rawQuery);
      const isAddress = /^\d+\s+.+/.test(query);

      if (isAddress) {
        const parts = query.match(/^(\d+)\s+(.*)$/);
        const streetNumber = parseInt(parts[1], 10);
        const streetName = normalize(parts[2]);

        const address = civicAddresses.find(function (item) {
          const attributes = item?.attributes;

          if (!attributes) return false;

          return (
            Number(attributes.StreetNumber) === streetNumber &&
            normalize(attributes.StreetName) === streetName
          );
        });

        if (!address) {
          setStatus("warning", "No matching civic address found. Try searching by road name only.");
          showSearchLayers(null, []);
          return;
        }

        currentAddress = address;

        const streetParity = calculateParity(streetNumber);

        const matchedSegments = roads.filter(function (road) {
          const attributes = road?.attributes;

          if (!attributes) return false;

          if (normalize(attributes.NAME_FULL) !== streetName) {
            return false;
          }

          const inLeft =
            inAddressRange(streetNumber, attributes.F_ADDR_L_911, attributes.T_ADDR_L_911) &&
            streetParity === calculateParity(attributes.F_ADDR_L_911);

          const inRight =
            inAddressRange(streetNumber, attributes.F_ADDR_R_911, attributes.T_ADDR_R_911) &&
            streetParity === calculateParity(attributes.F_ADDR_R_911);

          return inLeft || inRight;
        });

        if (!matchedSegments.length) {
          currentMatchingSegments = [];
          setStatus("warning", "Address point found, but no matching road segment for " + escapeHtml(rawQuery) + ".");
          renderResultsUI();
          showSearchLayers(address, []);
          return;
        }

        currentMatchingSegments = matchedSegments.sort(function (a, b) {
          return firstAddressValue(a) - firstAddressValue(b);
        });

        selectedSegment = currentMatchingSegments[0];
        selectedSide = detectSide(selectedSegment, streetNumber);

        setStatus("", "");
        renderResultsUI();
        showSearchLayers(address, currentMatchingSegments);
        highlightSelectedSegment();
        loadSelectedSideAddresses();
        focusSelection();
        return;
      }

      const tokens = query.split(" ").filter(Boolean);

      let matchingRoads = roads.filter(function (road) {
        const name = normalize(road?.attributes?.NAME_FULL);

        if (!name) return false;

        return name.includes(query) || tokens.every(function (token) {
          return name.includes(token);
        });
      });

      if (!matchingRoads.length) {
        setStatus("warning", "No road segments found for " + escapeHtml(rawQuery) + ".");
        showSearchLayers(null, []);
        return;
      }

      currentMatchingSegments = matchingRoads.sort(function (a, b) {
        return firstAddressValue(a) - firstAddressValue(b);
      });

      selectedSegment = currentMatchingSegments[0] || null;
      selectedSide = null;

      setStatus("", "");
      renderResultsUI();
      showSearchLayers(null, currentMatchingSegments);
      highlightSelectedSegment();
    }

    function renderResultsUI() {
      renderSummary();
      renderSegmentList();
      renderDetailPanel();
    }

    function renderSummary() {
      if (!currentMatchingSegments.length && !currentAddress) {
        summaryEl.hidden = true;
        summaryEl.innerHTML = "";
        return;
      }

      summaryEl.hidden = false;

      let title = "";
      let subtitle = "";

      if (currentAddress) {
        title = currentAddress.attributes.StreetNumber + " " + (currentAddress.attributes.StreetName || "");
        subtitle = currentMatchingSegments.length
          ? currentMatchingSegments.length + " matching segment" + (currentMatchingSegments.length === 1 ? "" : "s")
          : "No matching road segment";
      } else {
        const uniqueNames = new Set(
          currentMatchingSegments.map(function (segment) {
            return normalize(segment?.attributes?.NAME_FULL);
          })
        );

        title = uniqueNames.size === 1
          ? currentMatchingSegments[0].attributes.NAME_FULL || "Unknown road"
          : uniqueNames.size + " roads";

        subtitle = currentMatchingSegments.length + " segment" + (currentMatchingSegments.length === 1 ? "" : "s");
      }

      summaryEl.innerHTML =
        "<div>" +
        '<div class="summary-title">' + escapeHtml(title) + "</div>" +
        '<div class="summary-subtitle">' + escapeHtml(subtitle) + "</div>" +
        "</div>" +
        "<div>" +
        '<button class="mini-btn" type="button" onclick="fitAllResults()">Fit map</button>' +
        "</div>";
    }

    function renderSegmentList() {
      if (!currentMatchingSegments.length) {
        segmentListEl.hidden = true;
        segmentListEl.innerHTML = "";
        return;
      }

      segmentListEl.hidden = false;

      const scrollTop = segmentListEl.scrollTop;

      segmentListEl.innerHTML = currentMatchingSegments
        .map(function (segment) {
          const attributes = segment.attributes;
          const id = String(attributes.OBJECTID);
          const isSelected = selectedSegment && String(selectedSegment.attributes.OBJECTID) === id;

          const leftRange = formatRange(attributes.F_ADDR_L_911, attributes.T_ADDR_L_911);
          const rightRange = formatRange(attributes.F_ADDR_R_911, attributes.T_ADDR_R_911);
          const leftParity = calculateParity(attributes.F_ADDR_L_911);
          const rightParity = calculateParity(attributes.F_ADDR_R_911);

          return (
            '<div class="segment-row ' + (isSelected ? "active" : "") + '" data-id="' + escapeHtml(id) + '" role="button" tabindex="0">' +
            '<div class="segment-row-main">' +
            '<div class="segment-row-title">' + escapeHtml(attributes.NAME_FULL || "Unknown road") + "</div>" +
            '<div class="segment-row-ranges">' +
            '<span class="range-chip" title="Left range, parity ' + escapeHtml(leftParity) + '">L ' + escapeHtml(leftRange) + "</span>" +
            '<span class="range-chip" title="Right range, parity ' + escapeHtml(rightParity) + '">R ' + escapeHtml(rightRange) + "</span>" +
            "</div>" +
            "</div>" +
            '<div class="segment-row-actions">' +
            '<button type="button" class="mini-btn ' + (isSelected && selectedSide === "L" ? "active" : "") + '" data-side="L">Left</button>' +
            '<button type="button" class="mini-btn ' + (isSelected && selectedSide === "R" ? "active" : "") + '" data-side="R">Right</button>' +
            "</div>" +
            "</div>"
          );
        })
        .join("");

      segmentListEl.scrollTop = scrollTop;
    }

    segmentListEl.addEventListener("click", function (event) {
      const row = event.target.closest(".segment-row");

      if (!row) return;

      const id = row.dataset.id;
      const sideButton = event.target.closest("[data-side]");
      const side = sideButton ? sideButton.dataset.side : null;

      selectSegment(id, side, true);
    });

    segmentListEl.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" && event.key !== " ") return;

      const row = event.target.closest(".segment-row");

      if (!row) return;

      event.preventDefault();
      selectSegment(row.dataset.id, null, true);
    });

    function renderDetailPanel() {
      if (!selectedSegment) {
        detailEl.hidden = true;
        detailEl.innerHTML = "";
        return;
      }

      detailEl.hidden = false;

      const attributes = selectedSegment.attributes;
      const id = String(attributes.OBJECTID);

      const leftRange = formatRange(attributes.F_ADDR_L_911, attributes.T_ADDR_L_911);
      const rightRange = formatRange(attributes.F_ADDR_R_911, attributes.T_ADDR_R_911);
      const leftParity = calculateParity(attributes.F_ADDR_L_911);
      const rightParity = calculateParity(attributes.F_ADDR_R_911);

      detailEl.innerHTML =
        '<div class="detail-header">' +
        "<div>" +
        '<div class="detail-title">' + escapeHtml(attributes.NAME_FULL || "Unknown road") + "</div>" +
        '<div class="detail-subtitle">Segment ' + escapeHtml(id) + "</div>" +
        "</div>" +
        '<button class="mini-btn" type="button" onclick="clearSelection()">Clear</button>' +
        "</div>" +
        '<div class="detail-meta">' +
        "<div><strong>Left range</strong><br>" + escapeHtml(leftRange) + " · " + escapeHtml(leftParity) + "</div>" +
        "<div><strong>Right range</strong><br>" + escapeHtml(rightRange) + " · " + escapeHtml(rightParity) + "</div>" +
        "</div>" +
        '<div class="detail-tabs">' +
        '<button type="button" class="tab ' + (selectedSide === "L" ? "active" : "") + '" onclick="selectSelectedSide(\'L\')">Left</button>' +
        '<button type="button" class="tab ' + (selectedSide === "R" ? "active" : "") + '" onclick="selectSelectedSide(\'R\')">Right</button>' +
        "</div>" +
        '<div id="detail-address-list" class="detail-address-list">' +
        (selectedSide
          ? '<p class="message muted">Loading addresses...</p>'
          : '<p class="message muted">Choose Left or Right to view addresses.</p>') +
        "</div>";
    }

    function selectSelectedSide(side) {
      if (!selectedSegment) return;

      selectSegment(String(selectedSegment.attributes.OBJECTID), side, true);
    }

    function clearSelection() {
      selectedSegment = null;
      selectedSide = null;

      if (civicLayerGroup) {
        civicLayerGroup.clearLayers();
      }

      highlightSelectedSegment();
      renderSegmentList();
      renderDetailPanel();
    }

    function selectSegment(objectId, side, focusMap) {
      const segment = currentMatchingSegments.find(function (item) {
        return String(item?.attributes?.OBJECTID) === String(objectId);
      });

      if (!segment) return;

      selectedSegment = segment;
      selectedSide = side || null;

      renderSegmentList();
      renderDetailPanel();
      highlightSelectedSegment();

      if (selectedSide) {
        loadSelectedSideAddresses();
      } else {
        if (civicLayerGroup) {
          civicLayerGroup.clearLayers();
        }
      }

      if (focusMap) {
        focusSelection();
      }
    }

    function loadSelectedSideAddresses() {
      const listEl = document.getElementById("detail-address-list");

      if (!listEl || !selectedSegment || !selectedSide) return;

      listEl.innerHTML = '<p class="message muted">Loading addresses...</p>';

      const addresses = getAddressesForSegmentSide(
        selectedSegment.attributes,
        selectedSegment.attributes.NAME_FULL,
        selectedSide
      );

      if (civicLayerGroup) {
        civicLayerGroup.clearLayers();
      }

      if (!addresses.length) {
        listEl.innerHTML = '<p class="message muted">No matching addresses in this range.</p>';
        focusSelection();
        return;
      }

      listEl.innerHTML =
        '<div class="detail-count">' + addresses.length + " addresses</div>" +
        addresses
          .map(function (address) {
            const attributes = address.attributes;

            return (
              '<div class="address-item">' +
              escapeHtml(attributes.StreetNumber + " " + (attributes.StreetName || "")) +
              ' <span style="color: var(--text-muted);">(' +
              escapeHtml(attributes.Location || "N/A") +
              ")</span></div>"
            );
          })
          .join("");

      addresses.forEach(function (address) {
        if (address.geometry && address.geometry.x != null && address.geometry.y != null) {
          const coords = reprojectCoord(address.geometry.x, address.geometry.y);
          const lon = coords[0];
          const lat = coords[1];

          if (!isNaN(lat) && !isNaN(lon)) {
            L.marker([lat, lon], {
              icon: L.divIcon({
                className: "custom-civic-marker",
                html: "C",
                iconSize: [28, 28],
                iconAnchor: [14, 14]
              })
            })
              .bindPopup(
                "<strong>Civic:</strong> " +
                escapeHtml(address.attributes.StreetNumber + " " + (address.attributes.StreetName || ""))
              )
              .addTo(civicLayerGroup);
          }
        }
      });

      focusSelection();
    }

    function initMap() {
      if (map) return;

      map = L.map("map").setView([44.3, -76.4], 10);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);

      roadLayerGroup = L.featureGroup().addTo(map);
      civicLayerGroup = L.featureGroup().addTo(map);

      window.addEventListener("resize", function () {
        map.invalidateSize();
      });
    }

    function showSearchLayers(address, segments) {
      initMap();

      roadLayerGroup.clearLayers();
      civicLayerGroup.clearLayers();
      segmentLayers = {};

      if (address) {
        addAddressMarker(address);
      }

      segments.forEach(function (segment) {
        addSegmentLayer(segment);
      });

      if (segments.length || address) {
        fitAllResults();
      } else {
        map.setView([44.3, -76.4], 10);
      }

      highlightSelectedSegment();

      requestAnimationFrame(function () {
        map.invalidateSize();
      });
    }

    function addAddressMarker(address) {
      if (!address.geometry || address.geometry.x == null || address.geometry.y == null) return;

      const coords = reprojectCoord(address.geometry.x, address.geometry.y);
      const lon = coords[0];
      const lat = coords[1];

      if (isNaN(lat) || isNaN(lon)) return;

      L.marker([lat, lon])
        .bindPopup(
          "<strong>Civic Address</strong><br>" +
          escapeHtml(address.attributes.Location || "N/A")
        )
        .addTo(roadLayerGroup);
    }

    function addSegmentLayer(segment) {
      const attributes = segment?.attributes;
      const geometry = segment?.geometry;

      if (!attributes || !geometry || !geometry.paths || !geometry.paths.length) return;

      const id = String(attributes.OBJECTID);
      const layer = L.featureGroup();
      let hasGeometry = false;

      geometry.paths.forEach(function (path) {
        const latlngs = path
          .map(function (point) {
            const coords = reprojectCoord(point[0], point[1]);
            const lon = coords[0];
            const lat = coords[1];

            if (isNaN(lat) || isNaN(lon)) {
              return null;
            }

            return [lat, lon];
          })
          .filter(function (point) {
            return point !== null;
          });

        if (!latlngs.length) return;

        hasGeometry = true;

        L.polyline(latlngs, {
          color: "#064e3b",
          weight: 4,
          opacity: 0.65
        }).addTo(layer);
      });

      if (!hasGeometry) return;

      const leftRange = formatRange(attributes.F_ADDR_L_911, attributes.T_ADDR_L_911);
      const rightRange = formatRange(attributes.F_ADDR_R_911, attributes.T_ADDR_R_911);

      layer.bindPopup(
        "<strong>" + escapeHtml(attributes.NAME_FULL || "Unknown road") + "</strong><br>" +
        "Left: " + escapeHtml(leftRange) + "<br>" +
        "Right: " + escapeHtml(rightRange)
      );

      layer.on("click", function () {
        selectSegment(id, null, true);
      });

      layer.addTo(roadLayerGroup);
      segmentLayers[id] = layer;
    }

    function highlightSelectedSegment() {
      if (!map) return;

      Object.entries(segmentLayers).forEach(function (entry) {
        const id = entry[0];
        const layer = entry[1];

        const isSelected = selectedSegment && String(selectedSegment.attributes.OBJECTID) === id;

        const style = {
          color: isSelected ? "#10b981" : "#064e3b",
          weight: isSelected ? 7 : 4,
          opacity: isSelected ? 1 : 0.65
        };

        if (typeof layer.setStyle === "function") {
          layer.setStyle(style);
        } else if (typeof layer.eachLayer === "function") {
          layer.eachLayer(function (child) {
            child.setStyle(style);
          });
        }

        if (isSelected && typeof layer.bringToFront === "function") {
          layer.bringToFront();
        }
      });
    }

    function fitAllResults() {
      if (!map) return;

      const layers = [];

      if (roadLayerGroup && roadLayerGroup.getLayers().length) {
        layers.push(roadLayerGroup);
      }

      if (!layers.length) {
        map.setView([44.3, -76.4], 10);
        return;
      }

      try {
        map.fitBounds(L.featureGroup(layers).getBounds().pad(0.2));
      } catch (error) {
        map.setView([44.3, -76.4], 10);
      }
    }

    function focusSelection() {
      if (!map) return;

      const layers = [];

      if (selectedSegment) {
        const selectedLayer = segmentLayers[String(selectedSegment.attributes.OBJECTID)];

        if (selectedLayer) {
          layers.push(selectedLayer);
        }
      }

      if (civicLayerGroup && civicLayerGroup.getLayers().length) {
        layers.push(civicLayerGroup);
      }

      if (!layers.length) {
        fitAllResults();
        return;
      }

      try {
        map.fitBounds(L.featureGroup(layers).getBounds().pad(0.25));
      } catch (error) {
        map.setView([44.3, -76.4], 10);
      }
    }

    document.addEventListener("DOMContentLoaded", loadData);
  </script>
</body>
</html>
