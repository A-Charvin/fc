<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontenac FlightDeck</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-imageoverlay-rotated@0.2.1/Leaflet.ImageOverlay.Rotated.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --panel-hover: #f1f5f9; --border: #e2e8f0;
    --border-strong: #cbd5e1; --text: #0f172a; --text-muted: #64748b; --text-faint: #94a3b8;
    --primary: #2563eb; --primary-hover: #1d4ed8; --primary-soft: #eff6ff;
    --ok: #16a34a; --err: #dc2626; --radius: 8px; --radius-lg: 12px;
    --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  }
  [data-theme="dark"] {
    --bg: #0f172a; --panel: #1e293b; --panel-hover: #334155; --border: #334155;
    --border-strong: #475569; --text: #f8fafc; --text-muted: #94a3b8; --text-faint: #64748b;
    --primary: #3b82f6; --primary-hover: #60a5fa; --primary-soft: #1e3a8a;
    --ok: #22c55e; --err: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
  #app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

  #sidebar { width: 380px; min-width: 380px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1000; transition: background 0.2s; }
  #sidebar-header { padding: 24px 24px 20px; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand-title { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .brand-title svg { color: var(--primary); }
  #theme-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
  #theme-btn:hover { background: var(--panel-hover); color: var(--text); }
  #sidebar-header p { font-size: 13px; line-height: 1.5; color: var(--text-muted); margin: 0; }

  #load-section, #basemap-section { padding: 20px 24px; border-bottom: 1px solid var(--border); }
  button { font-family: inherit; border: none; cursor: pointer; transition: all 0.15s; }
  button:active { transform: translateY(1px); }
  #load-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; background: var(--primary); color: white; border-radius: var(--radius); font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
  #load-btn:hover { background: var(--primary-hover); }
  #load-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  #load-btn.loading svg.plus { display: none; }
  #load-btn .spinner { display: none; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
  #load-btn.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 10px; }
  .basemap-options { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: var(--radius); border: 1px solid var(--border); }
  .basemap-btn { flex: 1; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 500; padding: 6px 0; border-radius: 6px; }
  .basemap-btn:hover { color: var(--text); background: var(--panel-hover); }
  .basemap-btn.active { background: var(--panel); color: var(--primary); box-shadow: var(--shadow); font-weight: 600; }

  #groups-section { flex: 1; overflow-y: auto; padding: 16px 0; }
  #empty-state { color: var(--text-faint); font-size: 13px; text-align: center; padding: 40px 24px; line-height: 1.6; }
  .group { margin: 0 16px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
  .group-header { display: grid; grid-template-columns: 20px 18px 1fr auto auto; align-items: center; gap: 10px; padding: 12px 14px; background: var(--panel); border-bottom: 1px solid var(--border); cursor: pointer; }
  .group.collapsed .group-header { border-bottom: none; }
  .chevron { background: none; padding: 2px; color: var(--text-faint); display: flex; align-items: center; justify-content: center; border-radius: 4px; }
  .chevron:hover { color: var(--text); background: var(--panel-hover); }
  .chevron svg { transition: transform 0.2s; }
  .group.collapsed .chevron svg { transform: rotate(-90deg); }
  .group-name { font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { background: none; padding: 4px; color: var(--text-faint); display: flex; align-items: center; border-radius: 4px; }
  .icon-btn:hover { color: var(--primary); background: var(--primary-soft); }
  .icon-btn.danger:hover { color: var(--err); background: #fef2f2; }
  [data-theme="dark"] .icon-btn.danger:hover { background: #450a0a; }
  .group-count { font-size: 12px; font-weight: 500; color: var(--text-faint); background: var(--bg); padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
  .group-actions { display: flex; align-items: center; gap: 2px; }

  input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border: 1.5px solid var(--border-strong); border-radius: 4px; background: var(--panel); cursor: pointer; position: relative; }
  input[type="checkbox"]:checked { background: var(--primary); border-color: var(--primary); }
  input[type="checkbox"]:checked::after { content: ""; position: absolute; left: 4.5px; top: 1px; width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  input[type="checkbox"]:indeterminate { background: var(--primary); border-color: var(--primary); }
  input[type="checkbox"]:indeterminate::after { content: ""; position: absolute; left: 3px; top: 6px; width: 8px; height: 2px; background: white; }

  .layer-list { padding: 8px; }
  .group.collapsed .layer-list { display: none; }
  .layer-item { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; transition: background 0.1s; cursor: pointer; border: 1px solid transparent; }
  .layer-item:hover { background: var(--panel-hover); }
  .layer-item.disabled { opacity: 0.5; }
  .layer-item.selected { background: var(--primary-soft); border-color: var(--primary); }
  .layer-item.selected label { color: var(--primary); font-weight: 600; }
  .layer-item label { font-size: 12.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .layer-item.disabled label { color: var(--text-faint); }

  #transform-panel { padding: 16px 24px; border-top: 1px solid var(--border); background: var(--panel); display: none; flex-direction: column; gap: 12px; }
  #transform-panel.visible { display: flex; }
  .transform-header { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .transform-header span { font-family: monospace; font-size: 11px; color: var(--text-muted); background: var(--bg); padding: 2px 6px; border-radius: 4px; }

  .slider-container { display: flex; align-items: center; gap: 10px; }
  input[type="range"] { appearance: none; -webkit-appearance: none; flex: 1; height: 6px; background: var(--border); border-radius: 3px; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: var(--primary); border-radius: 50%; cursor: pointer; }

  .transform-actions { display: flex; gap: 8px; }
  .btn-secondary { flex: 1; padding: 8px; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-weight: 500; }
  .btn-secondary:hover { background: var(--panel-hover); color: var(--text); }
  .btn-secondary.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

  #status-bar { padding: 14px 24px; border-top: 1px solid var(--border); font-size: 12px; font-weight: 500; color: var(--text-muted); min-height: 20px; background: var(--panel); }
  #status-bar.err { color: var(--err); }
  #status-bar.ok { color: var(--ok); }

  #map { flex: 1; height: 100%; background: #e2e8f0; }
  [data-theme="dark"] #map { background: #0f172a; }
  .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,0.8) !important; border-radius: 4px 0 0 0; }
  [data-theme="dark"] .leaflet-control-attribution { background: rgba(15, 23, 42, 0.8) !important; color: #94a3b8 !important; }
  .leaflet-control-zoom { border: none !important; box-shadow: var(--shadow-lg) !important; border-radius: var(--radius) !important; overflow: hidden; }
  .leaflet-control-zoom a { font-family: inherit; background: var(--panel) !important; color: var(--text) !important; border-bottom: 1px solid var(--border) !important; width: 32px !important; height: 32px !important; line-height: 32px !important; font-size: 16px !important; }
  .leaflet-control-zoom a:hover { background: var(--panel-hover) !important; color: var(--primary) !important; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <div class="brand">
        <div class="brand-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          Frontenac FlightDeck
        </div>
        <button id="theme-btn" title="Toggle theme"></button>
      </div>
      <p>Load folders of drone captures with matching world files. Group, isolate, and visualize your flight data seamlessly.</p>
    </div>

    <div id="load-section">
      <button id="load-btn">
        <svg class="plus" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="spinner"></span>
        <span>Add Drone Folder</span>
      </button>
    </div>

    <div id="basemap-section">
      <div class="section-label">Basemap</div>
      <div class="basemap-options">
        <button class="basemap-btn active" data-map="Satellite">Satellite</button>
        <button class="basemap-btn" data-map="Street Map">Street</button>
        <button class="basemap-btn" data-map="No Basemap">None</button>
      </div>
    </div>

    <div id="groups-section">
      <div id="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        No folders loaded yet.<br>Add a drone folder to begin plotting.
      </div>
    </div>

    <div id="transform-panel">
      <div class="transform-header">
        Transform Selected Image
        <span id="rotation-value">0.0 deg</span>
      </div>
      <div class="slider-container">
        <input type="range" id="rotation-slider" min="-180" max="180" step="0.1" value="0">
      </div>
      <div class="transform-actions">
        <button class="btn-secondary" id="reset-transform-btn">Reset</button>
        <button class="btn-secondary" id="drag-mode-btn">Enable Move</button>
      </div>
    </div>

    <div id="status-bar"></div>
  </aside>

  <div id="map"></div>
</div>

<script>
  const map = L.map('map', { zoomControl: false, maxZoom: 23, minZoom: 2 }).setView([45.0, -76.7], 13);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  proj4.defs("EPSG:32618", "+proj=utm +zone=18 +datum=WGS84 +units=m +no_defs");

  const basemaps = {
    "Satellite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxZoom: 23 }),
    "Street Map": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 23 }),
    "No Basemap": null
  };
  let currentBasemap = basemaps["Satellite"];
  currentBasemap.addTo(map);

  document.querySelectorAll('.basemap-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.basemap-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const mapName = btn.getAttribute('data-map');
      if (currentBasemap) map.removeLayer(currentBasemap);
      currentBasemap = basemaps[mapName];
      if (currentBasemap) currentBasemap.addTo(map);
    });
  });

  const themeBtn = document.getElementById('theme-btn');
  const ICON_SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  const ICON_MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  function updateThemeIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeBtn.innerHTML = isDark ? ICON_SUN : ICON_MOON;
  }
  themeBtn.addEventListener('click', () => {
    document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    updateThemeIcon();
  });
  updateThemeIcon();

  const loadBtn = document.getElementById('load-btn');
  const groupsSection = document.getElementById('groups-section');
  const emptyStateEl = document.getElementById('empty-state');
  const statusEl = document.getElementById('status-bar');
  const transformPanel = document.getElementById('transform-panel');
  const rotationSlider = document.getElementById('rotation-slider');
  const rotationValue = document.getElementById('rotation-value');
  const resetBtn = document.getElementById('reset-transform-btn');
  const dragModeBtn = document.getElementById('drag-mode-btn');

  const ICON_CHEVRON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  const ICON_TARGET = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>';
  const ICON_CLOSE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

  const groups = [];
  let groupCounter = 0;
  let currentSelection = null;
  let isDragModeEnabled = false;
  let isDraggingImage = false;
  let dragStartPoint = null;
  let dragStartCorners = null;
  let rafPending = false;

  function setStatus(msg, kind) { statusEl.textContent = msg || ''; statusEl.className = kind ? kind : ''; }
  function refreshEmptyState() { emptyStateEl.style.display = groups.length ? 'none' : 'block'; }
  function uniqueGroupName(base) {
    const used = new Set(groups.map(g => g.name));
    if (!used.has(base)) return base;
    let n = 2; while (used.has(`${base} (${n})`)) n++;
    return `${base} (${n})`;
  }

  function updateGroupHeaderState(group) {
    const total = group.layers.length;
    const checkedCount = group.layers.filter(l => l.checked).length;
    group.checkboxEl.checked = checkedCount === total && total > 0;
    group.checkboxEl.indeterminate = checkedCount > 0 && checkedCount < total;
    group.countEl.textContent = total ? `${checkedCount}/${total}` : '';
  }

  function toggleLayer(group, entry, checked) {
    entry.checked = checked;
    entry.rowEl.querySelector('input').checked = checked;
    entry.rowEl.classList.toggle('disabled', !checked);
    if (checked) map.addLayer(entry.overlay);
    else map.removeLayer(entry.overlay);
    updateGroupHeaderState(group);
  }
  function toggleGroup(group, checked) { group.layers.forEach(entry => toggleLayer(group, entry, checked)); }
  function groupBounds(group) { return group.layers.reduce((acc, l) => acc.concat(l.bounds), []); }

  function rotatePoint(center, point, angleDeg) {
    const cosLat = Math.cos(center.lat * Math.PI / 180);
    const dLat = point.lat - center.lat;
    const dLng = (point.lng - center.lng) * cosLat;
    const rad = angleDeg * Math.PI / 180;
    const cosA = Math.cos(rad);
    const sinA = Math.sin(rad);
    const newDLat = dLat * cosA - dLng * sinA;
    const newDLng = dLat * sinA + dLng * cosA;
    return L.latLng(center.lat + newDLat, center.lng + newDLng / cosLat);
  }

  function getCenter(corners) {
    let latSum = 0, lngSum = 0;
    corners.forEach(c => { latSum += c.lat; lngSum += c.lng; });
    return L.latLng(latSum / 4, lngSum / 4);
  }

  function transformedCorners(entry) {
    const center = getCenter(entry.baseCorners);
    return entry.baseCorners.map(c => rotatePoint(center, c, entry.currentRotation));
  }

  function bindOverlayEvents(entry) {
    entry.overlay.on('click', (e) => { L.DomEvent.stopPropagation(e); selectLayer(entry); });
    const imgEl = entry.overlay.getElement();
    if (!imgEl) return;
    imgEl.style.cursor = isDragModeEnabled ? 'grab' : 'pointer';
    imgEl.addEventListener('mousedown', (e) => {
      if (!isDragModeEnabled) return;
      selectLayer(entry);
      isDraggingImage = true;
      dragStartPoint = map.mouseEventToContainerPoint(e);
      dragStartCorners = entry.baseCorners.map(c => L.latLng(c.lat, c.lng));
      document.body.style.cursor = 'grabbing';
      L.DomEvent.stopPropagation(e);
      L.DomEvent.preventDefault(e);
    });
  }

  // The rotated overlay plugin has no public corner update method,
  // so we rebuild the overlay from the new corners. Public API only.
  function refreshOverlay(entry) {
    const corners = transformedCorners(entry);
    if (entry.overlay) map.removeLayer(entry.overlay);
    entry.overlay = L.imageOverlay.rotated(entry.url, corners[0], corners[1], corners[2], {
      opacity: 0.9, interactive: true
    }).addTo(map);
    entry.bounds = corners;
    bindOverlayEvents(entry);
  }

  function requestRefresh(entry) {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      refreshOverlay(entry);
    });
  }

  function selectLayer(entry) {
    if (currentSelection) currentSelection.rowEl.classList.remove('selected');
    currentSelection = entry;
    entry.rowEl.classList.add('selected');
    entry.rowEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    transformPanel.classList.add('visible');
    rotationSlider.value = entry.currentRotation;
    rotationValue.textContent = `${entry.currentRotation.toFixed(1)} deg`;
    dragModeBtn.classList.toggle('active', isDragModeEnabled);
    const imgEl = entry.overlay.getElement();
    if (imgEl) imgEl.style.cursor = isDragModeEnabled ? 'grab' : 'pointer';
  }

  rotationSlider.addEventListener('input', (e) => {
    if (!currentSelection) return;
    currentSelection.currentRotation = parseFloat(e.target.value);
    rotationValue.textContent = `${currentSelection.currentRotation.toFixed(1)} deg`;
    requestRefresh(currentSelection);
  });

  resetBtn.addEventListener('click', () => {
    if (!currentSelection) return;
    currentSelection.currentRotation = 0;
    currentSelection.baseCorners = currentSelection.originalCorners.map(c => L.latLng(c.lat, c.lng));
    rotationSlider.value = 0;
    rotationValue.textContent = '0.0 deg';
    refreshOverlay(currentSelection);
  });

  dragModeBtn.addEventListener('click', () => {
    isDragModeEnabled = !isDragModeEnabled;
    dragModeBtn.classList.toggle('active', isDragModeEnabled);
    dragModeBtn.textContent = isDragModeEnabled ? 'Disable Move' : 'Enable Move';
    groups.forEach(g => g.layers.forEach(entry => {
      const imgEl = entry.overlay.getElement();
      if (imgEl) imgEl.style.cursor = isDragModeEnabled ? 'grab' : 'pointer';
    }));
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDraggingImage || !currentSelection) return;
    const currentPoint = map.mouseEventToContainerPoint(e);
    const startLatLng = map.containerPointToLatLng(dragStartPoint);
    const currentLatLng = map.containerPointToLatLng(currentPoint);
    const dLat = currentLatLng.lat - startLatLng.lat;
    const dLng = currentLatLng.lng - startLatLng.lng;
    currentSelection.baseCorners = dragStartCorners.map(c => L.latLng(c.lat + dLat, c.lng + dLng));
    requestRefresh(currentSelection);
  });

  document.addEventListener('mouseup', () => {
    if (isDraggingImage) {
      isDraggingImage = false;
      document.body.style.cursor = 'default';
      if (currentSelection && isDragModeEnabled) {
        const imgEl = currentSelection.overlay.getElement();
        if (imgEl) imgEl.style.cursor = 'grab';
      }
    }
  });

  function createGroup(name, dirHandle) {
    groupCounter++;
    const group = { id: `g${groupCounter}`, name: uniqueGroupName(name), dirHandle, layers: [], collapsed: false };
    const el = document.createElement('div'); el.className = 'group';
    const header = document.createElement('div'); header.className = 'group-header';
    const chevron = document.createElement('button'); chevron.className = 'chevron'; chevron.innerHTML = ICON_CHEVRON;
    const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = true;
    const nameWrap = document.createElement('div'); nameWrap.className = 'group-name-wrap';
    const nameLabel = document.createElement('span'); nameLabel.className = 'group-name'; nameLabel.textContent = group.name;
    nameWrap.appendChild(nameLabel);
    const count = document.createElement('span'); count.className = 'group-count';
    const actions = document.createElement('div'); actions.className = 'group-actions';
    const locateBtn = document.createElement('button'); locateBtn.className = 'icon-btn'; locateBtn.innerHTML = ICON_TARGET;
    const closeBtn = document.createElement('button'); closeBtn.className = 'icon-btn danger'; closeBtn.innerHTML = ICON_CLOSE;
    actions.appendChild(locateBtn); actions.appendChild(closeBtn);
    header.appendChild(chevron); header.appendChild(checkbox); header.appendChild(nameWrap); header.appendChild(count); header.appendChild(actions);
    const layerList = document.createElement('div'); layerList.className = 'layer-list';
    el.appendChild(header); el.appendChild(layerList); groupsSection.appendChild(el);
    group.el = el; group.checkboxEl = checkbox; group.countEl = count; group.layerListEl = layerList;

    header.addEventListener('click', (e) => { if (e.target === checkbox || e.target.closest('.icon-btn')) return; group.collapsed = !group.collapsed; el.classList.toggle('collapsed', group.collapsed); });
    checkbox.addEventListener('change', (e) => { e.stopPropagation(); toggleGroup(group, checkbox.checked); });
    locateBtn.addEventListener('click', (e) => { e.stopPropagation(); const bounds = groupBounds(group); if (bounds.length) map.fitBounds(bounds, { maxZoom: 23, padding: [20, 20] }); });
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      group.layers.forEach(l => {
        map.removeLayer(l.overlay);
        if (currentSelection === l) { currentSelection = null; transformPanel.classList.remove('visible'); }
      });
      el.remove(); const idx = groups.indexOf(group); if (idx >= 0) groups.splice(idx, 1); refreshEmptyState();
    });
    groups.push(group); refreshEmptyState(); return group;
  }

  function addLayerRow(group, entry) {
    const row = document.createElement('div'); row.className = 'layer-item';
    const chk = document.createElement('input'); chk.type = 'checkbox'; chk.checked = true;
    const label = document.createElement('label'); label.textContent = entry.name;
    const locateBtn = document.createElement('button'); locateBtn.className = 'icon-btn'; locateBtn.innerHTML = ICON_TARGET;

    label.addEventListener('click', (e) => { e.stopPropagation(); selectLayer(entry); });
    row.addEventListener('click', (e) => { if (e.target !== chk && e.target !== locateBtn) selectLayer(entry); });
    chk.addEventListener('change', (e) => { e.stopPropagation(); toggleLayer(group, entry, chk.checked); });
    locateBtn.addEventListener('click', (e) => { e.stopPropagation(); map.fitBounds(entry.bounds, { maxZoom: 23, padding: [20, 20] }); });

    row.appendChild(chk); row.appendChild(label); row.appendChild(locateBtn);
    group.layerListEl.appendChild(row); entry.rowEl = row;
  }

  async function loadFolderAsGroup(dirHandle) {
    const group = createGroup(dirHandle.name, dirHandle);
    const images = {}; const worldFiles = {};
    for await (const entry of dirHandle.values()) {
      if (entry.kind !== 'file') continue;
      const name = entry.name.toLowerCase();
      if (name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png')) images[entry.name] = entry;
      else if (name.endsWith('.jgw') || name.endsWith('.pgw') || name.endsWith('.tfw')) worldFiles[entry.name] = entry;
    }

    let loadedCount = 0; let skippedCount = 0;
    for (const [imgName, imgHandle] of Object.entries(images)) {
      const dot = imgName.lastIndexOf('.'); const baseName = imgName.substring(0, dot); const ext = imgName.substring(dot).toLowerCase();
      const worldExt = ext === '.png' ? '.pgw' : '.jgw';
      const worldHandle = worldFiles[baseName + worldExt];
      if (!worldHandle) { skippedCount++; continue; }

      const worldFile = await worldHandle.getFile(); const text = await worldFile.text();
      const lines = text.split('\n').map(l => parseFloat(l.trim())).filter(n => !isNaN(n));
      if (lines.length < 6) { skippedCount++; continue; }
      const [A, D, B, E, C, F] = lines;

      const imgFile = await imgHandle.getFile(); const imgUrl = URL.createObjectURL(imgFile);
      const tempImg = new Image(); tempImg.src = imgUrl;
      await new Promise((resolve, reject) => { tempImg.onload = resolve; tempImg.onerror = reject; });
      const width = tempImg.width; const height = tempImg.height;

      const pixelToLatLng = (col, row) => {
        const x = A * col + B * row + C; const y = D * col + E * row + F;
        const [lon, lat] = proj4("EPSG:32618", "EPSG:4326", [x, y]);
        return L.latLng(lat, lon);
      };

      const corners = [
        pixelToLatLng(-0.5, -0.5),
        pixelToLatLng(width - 0.5, -0.5),
        pixelToLatLng(-0.5, height - 0.5),
        pixelToLatLng(width - 0.5, height - 0.5)
      ];

      const entryObj = {
        name: imgName,
        url: imgUrl,
        overlay: null,
        bounds: corners.slice(0, 4),
        checked: true,
        originalCorners: corners.map(c => L.latLng(c.lat, c.lng)),
        baseCorners: corners.map(c => L.latLng(c.lat, c.lng)),
        currentRotation: 0
      };

      entryObj.overlay = L.imageOverlay.rotated(imgUrl, corners[0], corners[1], corners[2], {
        opacity: 0.9, interactive: true
      }).addTo(map);
      bindOverlayEvents(entryObj);

      group.layers.push(entryObj);
      addLayerRow(group, entryObj);
      loadedCount++;
    }
    updateGroupHeaderState(group);
    if (loadedCount > 0) map.fitBounds(groupBounds(group), { padding: [30, 30] });
    return { loadedCount, skippedCount };
  }

  loadBtn.addEventListener('click', async () => {
    let dirHandle;
    try { dirHandle = await window.showDirectoryPicker(); }
    catch (err) { if (err.name === 'AbortError') return; setStatus('Could not open folder picker: ' + err.message, 'err'); return; }
    loadBtn.disabled = true; loadBtn.classList.add('loading'); setStatus(`Reading "${dirHandle.name}"...`);
    try {
      const { loadedCount, skippedCount } = await loadFolderAsGroup(dirHandle);
      setStatus(skippedCount ? `Loaded ${loadedCount} images. ${skippedCount} skipped.` : `Loaded ${loadedCount} georeferenced images.`, 'ok');
    } catch (err) { console.error(err); setStatus('Error: ' + err.message, 'err'); }
    finally { loadBtn.disabled = false; loadBtn.classList.remove('loading'); }
  });
</script>
</body>
